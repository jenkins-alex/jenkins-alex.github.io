          title: Alexander Jenkins
          subtitle: "Hello! I'm Alex, a recent PhD from <a href=\"https://www.imperial.ac.uk\" target=\"_blank\">Imperial College London</a>, where I was awarded my doctorate for my thesis on <em>Graph-Based Spatiotemporal Machine Learning</em> in the Department of Electrical and Electronic Engineering, supervised by <a href=\"https://profiles.imperial.ac.uk/d.mandic\" target=\"_blank\">Prof Danilo Mandic</a> and <a href=\"https://profiles.imperial.ac.uk/f.ng\" target=\"_blank\">Prof Fu Siong Ng</a>.<br><br>My research developed methods for prediction and uncertainty quantification in complex spatiotemporal systems using graph neural networks, with a particular application to modelling the chaotic electrical flow in the fibrillating heart. This work resulted in publications at ICML and IEEE journals, presentations at NeurIPS and AAAI workshops, and two filed patents.<br><br>Currently, I'm an ML Associate at <a href=\"https://www.jpmorgan.com\" target=\"_blank\">J.P. Morgan</a>'s Machine Learning Centre of Excellence, working in the Time Series and Reinforcement Learning team &mdash; my internship there wraps up in November 2026. Before that, I held roles spanning academic research, finance, and technology, including positions at the <a href=\"https://www.ox.ac.uk\" target=\"_blank\">University of Oxford</a>, <a href=\"https://www.idsia.ch/en/\" target=\"_blank\">IDSIA (CH)</a>, and <a href=\"https://www.hummingbird.vc/\" target=\"_blank\">Hummingbird Venture Capital</a>."
